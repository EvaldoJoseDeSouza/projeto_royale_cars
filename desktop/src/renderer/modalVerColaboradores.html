<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colaboradores do Grupo</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="./modal.css" />
    <style>
        .item-colab { display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding:12px 14px; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:10px; background:#fff; }
        .item-colab .info strong { display:block; font-size:0.95rem; color:#010d3d; }
        .item-colab .info span { font-size:0.8rem; color:#6c757d; }
        .item-colab select { padding:7px 10px; border:1px solid var(--border-color); border-radius:6px;
            background:#f8f9fa; font-size:0.85rem; max-width:200px; }
        .vazio { text-align:center; color:#6c757d; padding:30px 10px; font-size:0.95rem; }
        .rotulo-mover { font-size:0.7rem; color:#6c757d; display:block; margin-bottom:3px; }
    </style>
</head>

<body>
    <div class="modal-scroll-wrapper">
        <div class="modal-header">
            <h3 id="titulo-modal">Colaboradores do Grupo</h3>
            <button class="btn-close-top" id="btn-fechar-topo" title="Fechar">
                <i class="ri-close-line" style="font-size: 1.2rem; display: block;"></i>
            </button>
        </div>

        <div class="modal-scroll-body" id="lista-colaboradores"></div>

        <div class="modal-footer">
            <button type="button" class="btn-cancel" id="btn-fechar">Fechar</button>
        </div>
    </div>

    <script src="./modalVerColaboradores.js"></script>
</body>

</html>
