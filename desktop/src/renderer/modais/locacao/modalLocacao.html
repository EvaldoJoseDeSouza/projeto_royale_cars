<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Locação</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilos/modal.css" />
  </head>
  <body>
    <div class="modal-header">
      <h3>Nova Locação (retirada)</h3>
      <button class="btn-close-top" id="btn-fechar-topo" title="Fechar">
        <i class="ri-close-line" style="font-size: 1.2rem; display: block"></i>
      </button>
    </div>

    <div class="modal-content">
      <form id="form-nova-locacao">
        <div class="form-group">
          <label for="select-cliente">Cliente *</label>
          <select id="select-cliente" required>
            <option value="">Carregando clientes...</option>
          </select>
          <p class="dica-campo">Clientes com CNH vencida aparecem bloqueados.</p>
        </div>

        <div class="form-group">
          <label for="select-veiculo">Veículo disponível *</label>
          <select id="select-veiculo" required>
            <option value="">Carregando veículos...</option>
          </select>
        </div>

        <div class="row-inputs">
          <div class="form-group">
            <label for="data-retirada">Retirada *</label>
            <input type="date" id="data-retirada" required />
          </div>
          <div class="form-group">
            <label for="data-prevista">Devolução prevista *</label>
            <input type="date" id="data-prevista" required />
          </div>
        </div>

        <div class="row-inputs">
          <div class="form-group">
            <label for="km-saida">Quilometragem de saída *</label>
            <input type="text" id="km-saida" inputmode="numeric" placeholder="Escolha o veículo" required />
            <p class="dica-campo" id="dica-km">O número do painel na hora da retirada.</p>
          </div>
          <div class="form-group">
            <label for="observacoes">Observações</label>
            <input type="text" id="observacoes" maxlength="500" placeholder="Opcional" />
          </div>
        </div>

        <div class="resumo-valores">
          <div class="resumo-row"><span>Diária:</span><span id="resumo-diaria">R$ 0,00</span></div>
          <div class="resumo-row"><span>Diárias previstas:</span><span id="resumo-dias">-</span></div>
          <div class="resumo-row total"><span>Valor previsto:</span><span id="resumo-total">R$ 0,00</span></div>
        </div>
        <p class="dica-campo">O valor final é calculado na devolução, pelos dias realmente usados.</p>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-save" id="btn-salvar">Registrar retirada</button>
        </div>
      </form>
    </div>

    <script src="../../compartilhado/formatos.js"></script>
    <script src="./modalLocacao.js"></script>
  </body>
</html>
