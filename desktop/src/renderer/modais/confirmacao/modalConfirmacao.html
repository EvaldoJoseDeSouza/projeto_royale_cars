<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmação</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../../estilos/modal.css" />
</head>

<body>
    <div class="modal-header">
        <h3 id="confirm-titulo">Confirmar Ação</h3>
        <button class="btn-close-top" id="btn-fechar-topo" title="Fechar">
            <i class="ri-close-line" style="font-size: 1.2rem; display: block;"></i>
        </button>
    </div>

    <div class="modal-content">
        <div class="confirm-icone-wrapper">
            <i class="ri-error-warning-line" id="confirm-icone"></i>
        </div>

        <p id="confirm-mensagem" class="confirm-texto">
            Tem certeza que deseja continuar?
        </p>

        <div class="modal-footer">
            <button type="button" class="btn-cancelar-modal cor-cinza" id="btn-cancelar-confirm">
                Cancelar
            </button>
            <button type="button" class="btn-confirm-acao" id="btn-confirmar-acao">
                Confirmar
            </button>
        </div>
    </div>

    <script src="./modalConfirmacao.js"></script>
</body>

</html>
