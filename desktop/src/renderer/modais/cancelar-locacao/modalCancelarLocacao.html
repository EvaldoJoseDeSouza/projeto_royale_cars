<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cancelar Locação</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilos/modal.css" />
  </head>
  <body>
    <div class="modal-header">
      <h3>Cancelar Locação</h3>
      <button class="btn-close-top" id="btn-fechar-topo" title="Fechar">
        <i class="ri-close-line" style="font-size: 1.2rem; display: block"></i>
      </button>
    </div>

    <div class="modal-content">
      <p id="texto-locacao" style="font-size: 0.9rem; color: #333; margin-bottom: 8px;"></p>
      <p class="dica-campo" style="margin-bottom: 14px;">
        Use só quando o aluguel não aconteceu (ex.: cliente desistiu na hora). Não há cobrança e o
        carro volta para a frota. Se o cliente usou o carro, registre a <strong>devolução</strong>.
      </p>

      <form id="form-cancelar">
        <div class="form-group">
          <label for="motivo">Motivo do cancelamento *</label>
          <textarea id="motivo" rows="3" maxlength="500" placeholder="Ex.: cliente desistiu antes de sair com o carro" required></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancelar-modal cor-cinza" id="btn-voltar">Voltar</button>
          <button type="submit" class="btn-confirm-acao cor-perigo" id="btn-confirmar">Cancelar aluguel</button>
        </div>
      </form>
    </div>

    <script src="../../compartilhado/formatos.js"></script>
    <script src="./modalCancelarLocacao.js"></script>
  </body>
</html>
