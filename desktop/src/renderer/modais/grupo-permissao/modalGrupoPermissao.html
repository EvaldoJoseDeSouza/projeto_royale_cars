<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modelo de Permissão</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../../estilos/modal.css" />
</head>
<body>
  <div class="modal-scroll-wrapper">
    <div class="modal-header">
      <h3 id="grupo-titulo">Novo Modelo de Permissão</h3>
      <button class="btn-close-top" id="btn-fechar-topo" title="Fechar">
        <i class="ri-close-line" style="font-size: 1.2rem; display: block;"></i>
      </button>
    </div>

    <div class="modal-scroll-body">
      <!-- PASSO 1 -->
      <div id="tela-templates">
        <h4 style="margin-bottom: 4px;">Escolha um ponto de partida</h4>
        <p style="font-size: 0.85rem; color: #777; margin-bottom: 16px;">Copie um modelo existente como base ou comece do zero.</p>
        <div id="lista-templates"></div>
      </div>

      <!-- PASSO 2 -->
      <div id="tela-formulario" style="display: none;">
        <button type="button" id="btn-voltar-templates" style="display: none; background: none; border: none; color: var(--blue-dark); font-weight: 600; cursor: pointer; margin-bottom: 14px; padding: 0;">
          <i class="ri-arrow-left-line"></i> Voltar
        </button>

        <div class="form-group">
          <label for="grupo-nome">Nome *</label>
          <input type="text" id="grupo-nome" placeholder="Ex: Gerente de Vendas" required />
        </div>

        <div class="form-group">
          <label for="grupo-descricao">Descrição</label>
          <input type="text" id="grupo-descricao" placeholder="Ex: Acesso a vendas e relatórios financeiros" />
        </div>

        <div class="permissoes-header">
          <h4 style="margin: 0;">Permissões</h4>
          <span class="badge-contagem" id="contador-permissoes">0 selecionadas</span>
        </div>

        <div id="lista-categorias"></div>
      </div>
    </div>

    <div class="modal-footer" id="footer-formulario" style="display: none;">
      <button type="button" class="btn-cancelar-modal cor-perigo" id="btn-cancelar">Cancelar</button>
      <button type="button" class="btn-confirm-acao cor-sucesso" id="btn-salvar-grupo">Salvar Modelo</button>
    </div>
  </div>

  <script src="./modalGrupoPermissao.js"></script>
</body>
</html>
