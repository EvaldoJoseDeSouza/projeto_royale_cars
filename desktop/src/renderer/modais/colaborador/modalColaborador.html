<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colaborador</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../../estilos/modal.css" />
</head>

<body>
    <div class="modal-scroll-wrapper">
        <div class="modal-header">
            <h3 id="titulo-modal-colaborador">Novo Colaborador</h3>
            <button class="btn-close-top" id="btn-fechar-topo" title="Fechar">
                <i class="ri-close-line" style="font-size: 1.2rem; display: block;"></i>
            </button>
        </div>

        <form id="form-colaborador" style="display:flex; flex-direction:column; flex:1; min-height:0;">
            <div class="modal-scroll-body">
                <p id="texto-explicacao" style="font-size:0.85rem; color:#777; margin-bottom:14px;">
                    Uma senha temporária será gerada. A pessoa cria a própria senha no primeiro acesso.
                </p>

                <div class="form-group">
                    <label for="colab-nome">Nome completo *</label>
                    <input type="text" id="colab-nome" maxlength="100" placeholder="Ex: João da Silva" />
                </div>

                <div class="row-inputs">
                    <div class="form-group">
                        <label for="colab-email">E-mail (login) *</label>
                        <input type="email" id="colab-email" maxlength="150" placeholder="joao@royalecars.com.br"
                            autocomplete="off" />
                    </div>
                    <div class="form-group">
                        <label for="colab-cargo">Cargo *</label>
                        <select id="colab-cargo">
                            <option value="funcionario">Funcionário</option>
                            <option value="gerente">Gerente</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="colab-modelo">Usar modelo</label>
                    <select id="colab-modelo">
                        <option value="">Escolha para marcar as permissões de uma vez...</option>
                    </select>
                </div>

                <div class="permissoes-header">
                    <h4 style="margin: 0;">Permissões</h4>
                    <span class="badge-contagem" id="contador-permissoes">0 selecionadas</span>
                </div>

                <div id="lista-permissoes"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-save" id="btn-salvar">Cadastrar e gerar senha</button>
            </div>
        </form>
    </div>

    <script src="../../compartilhado/permissoes.js"></script>
    <script src="./modalColaborador.js"></script>
</body>

</html>
