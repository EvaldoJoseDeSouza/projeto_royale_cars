<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Novo Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="./modal.css" />
  </head>
  <body>
    <div class="modal-header">
      <h3>Cadastrar Cliente</h3>
      <button class="btn-close-top" id="btn-fechar-topo" title="Fechar">
        <i class="ri-close-line" style="font-size: 1.2rem; display: block;"></i>
      </button>
    </div>

    <div class="modal-content">
      <form id="form-cadastro-cliente">
        <div class="form-group">
          <label for="nome">Nome Completo *</label>
          <input
            type="text"
            id="nome"
            placeholder="Ex: Marcos Almeida"
            required
          />
        </div>

        <div class="row-inputs">
          <div class="form-group">
            <label for="cpf">CPF *</label>
            <input
              type="text"
              id="cpf"
              placeholder="Ex: 000.000.000-00"
              required
            />
          </div>

          <div class="form-group">
            <label for="cnh">CNH *</label>
            <input
              type="text"
              id="cnh"
              placeholder="Ex: 00000000000"
              required
            />
          </div>
        </div>

        <div class="row-inputs">
          <div class="form-group">
            <label for="telefone">Telefone *</label>
            <input
              type="text"
              id="telefone"
              placeholder="Ex: (11) 99999-9999"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input 
              type="email" 
              id="email" 
              placeholder="Ex: cliente@email.com" 
            />
          </div>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço Residencial</label>
          <input 
            type="text" 
            id="endereco" 
            placeholder="Ex: Av. Paulista, 1200 - São Paulo" 
          />
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btn-cancelar">
            Cancelar
          </button>
          <button type="submit" class="btn-save">Salvar Cliente</button>
        </div>
      </form>
    </div>

    <script src="./modalCliente.js"></script>
  </body>
</html>
