<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royale Cars</title>
  <link rel="stylesheet" href="login.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

  <div class="login-container">

    <div class="login-banner">
      <div class="banner-content">
        <h1>Gestão completa</h1>
        <h2>para sua locadora.</h2>
        <p>Controle frotas, contratos, clientes e finanças em uma única plataforma.</p>
      </div>
      <div class="banner-footer">
        © 2026 Royale Cars. Todos os direitos reservados.
      </div>
    </div>

    <div class="login-form-side">
      <div class="form-wrapper">

        <div class="form-header">
          <div class="logo-wrapper">
            <img src="../../../imagens/icone.png" class="login-logo-img" alt="Royale Cars Logo">
          </div>
          <h2 class="logo-text">
            <span class="brand-royale">ROYALE</span><span class="brand-cars"> CARS</span>
          </h2>
        </div>

        <div id="wrapper-login">
          <form id="form-login">
            <div class="input-group">
              <label for="email">E-mail *</label>
              <input type="email" id="email" name="email" placeholder="seuemail@royalecars.com.br" required
                autocomplete="username">
            </div>

            <div class="input-group">
              <label for="senha">Senha *</label>
              <div class="password-wrapper"
                style="position: relative; display: flex; align-items: center; width: 100%;">
                <input type="password" id="senha" name="senha" placeholder="••••••••" required
                  autocomplete="current-password" style="width: 100%; padding-right: 45px;">
                <button type="button" id="btn-olho-login"
                  style="position: absolute; right: 12px; background: none; border: none; color: #adb5bd; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;">
                  <i id="ic-olho-login" class="ri-eye-line"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-entrar" id="btn-login">
              <span id="btn-texto">Entrar no Sistema</span>

              <span id="btn-spinner" class="btn-status-container" style="display: none;">
                <svg class="spinner-icon" viewBox="0 0 50 50">
                  <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                </svg>
                Autenticando...
              </span>

              <span id="btn-check" class="btn-status-container" style="display: none;">
                <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Login Autorizado!
              </span>
            </button>
          </form>

          <div class="signup-footer">
            <p>Esqueceu a senha ou não tem acesso? Fale com o responsável pela locadora.</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>

</html>
